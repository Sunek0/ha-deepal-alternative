                        'on': /deepal/frontend/assets/s05/estado_planta/ORB1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/ORB0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/ORB0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/ORB0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_front_left_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_front_left_door
                          state: 'off'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OwindowsLF1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_front_right_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_front_right_door
                          state: 'off'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OwindowsRF1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
