                        'on': /deepal/frontend/assets/s05/estado_planta/ORF1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/ORF0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/ORF0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/ORF0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_rear_left_door
                      state_image:
                        'on': /deepal/frontend/assets/s05/estado_planta/OLB1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/OLB0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/OLB0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/OLB0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_rear_right_door
