# Deepal Alternative - example dashboard
#
# Prefer the generated dashboard: Settings > Dashboards > Add dashboard >
# Community dashboards > Deepal creates one view per car with no YAML (it
# needs Home Assistant 2026.5+; on older versions use the same strategy from
# a YAML-mode dashboard with `strategy: {type: custom:deepal}`). This file
# stays as the manual, dependency-free alternative.
#
# A copy-ready sections view built only on the integration: the bundled
# `custom:deepal-card` (available from the card picker, no Lovelace resource
# to configure) and core Home Assistant cards. It needs no HACS cards, no
# helpers and no input_select navigation.
#
# How to use it:
#   1. Open the dashboard where you want the view and enter the RAW editor
#      (menu > Edit > menu > Edit in YAML).
#   2. Paste the contents of this file (its root key is `views:`); if the
#      dashboard already has views, paste the view dict as another list item.
#   3. Replace the placeholders with your own ids:
#      * `<device_id>`: the vehicle the card shows. Add `custom:deepal-card`
#        once from the card picker: the form lists your Deepal vehicles, and
#        the id shown there is the one to paste here.
#      * `garaje_deepal_s05_...`: entity ids depend on the vehicle name, the
#        area and the installation language (Settings > Devices & services,
#        or Developer tools > States). The ids below come from a vehicle
#        named "Garaje Deepal S05".
#   4. Save.
#
# Card choices follow the repository's dashboard design system:
#   * Tier 1: `custom:deepal-card` for the vehicle (layered picture, chips,
#     controls, climate and charging tabs).
#   * Core fallbacks: `tile` for the quick controls and tire pressures,
#     `history-graph` for the trends (one metric per graph; the Tier-1 mini
#     graph card needs a HACS install, which this example avoids) and
#     `markdown` for the templated alerts (no Tier-1 card renders a Jinja
#     sentence).

views:
  - title: Deepal S05
    path: deepal-s05
    icon: mdi:car
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: sensor.garaje_deepal_s05_battery_level
        name: Batería
        color: green
      - type: entity
        entity: sensor.garaje_deepal_s05_remaining_range
        name: Autonomía
        color: teal
      - type: entity
        entity: binary_sensor.garaje_deepal_s05_doors_lock_state
        name: Puertas
        color: red
      - type: entity
        entity: binary_sensor.garaje_deepal_s05_charger_plugged
        name: Cargador
        color: amber
    sections:
      # Full-width wrapper with the bundled card: the vehicle, its picture,
      # controls, climate and charging tabs, all first-party.
      - type: grid
        column_span: 2
        cards:
          - type: custom:deepal-card
            device_id: "<device_id>"
            grid_options:
              columns: full
      # Quick controls: the actions you want before opening the card.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Controles
            icon: mdi:car-cog
          - type: tile
            entity: lock.garaje_deepal_s05_s05_doors
            name: Puertas
            icon: mdi:car-door-lock
            color: red
            features:
              - type: lock-commands
            grid_options:
              columns: 6
          - type: tile
            entity: cover.garaje_deepal_s05_s05_windows
            name: Ventanillas
            icon: mdi:window-closed-variant
            color: cyan
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: cover.garaje_deepal_s05_s05_trunk
            name: Maletero
            icon: mdi:car-back
            color: blue
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: button.garaje_deepal_s05_s05_flash_lights
            name: Destello
            icon: mdi:car-light-alert
            color: amber
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.garaje_deepal_s05_s05_flash_lights
            grid_options:
              columns: 6
          - type: tile
            entity: button.garaje_deepal_s05_s05_honk_horn
            name: Claxon
            icon: mdi:bullhorn
            color: red
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.garaje_deepal_s05_s05_honk_horn
            grid_options:
              columns: 6
          - type: tile
            entity: button.garaje_deepal_s05_s05_flash_and_honk
            name: Destello y claxon
            icon: mdi:car-light-alert
            color: orange
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.garaje_deepal_s05_s05_flash_and_honk
            grid_options:
              columns: 6
          - type: tile
            entity: button.garaje_deepal_s05_s05_refresh_vehicle_data
            name: Actualizar datos
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.garaje_deepal_s05_s05_refresh_vehicle_data
            grid_options:
              columns: 6
      # Trends: one metric per graph, a consistent 24 h window.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Batería y autonomía
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - entity: sensor.garaje_deepal_s05_battery_level
                name: Batería
                color: green
            hours_to_show: 24
          - type: history-graph
            entities:
              - entity: sensor.garaje_deepal_s05_remaining_range
                name: Autonomía
                color: teal
            hours_to_show: 24
      # Tire pressures: tap opens the entity. Alarms surface in the alerts
      # card below, because a core tile cannot colour itself by template.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Neumáticos
            icon: mdi:tire
          - type: tile
            entity: sensor.garaje_deepal_s05_tire_front_left_pressure
            name: Del. izq.
            icon: mdi:tire
            tap_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.garaje_deepal_s05_tire_front_right_pressure
            name: Del. der.
            icon: mdi:tire
            tap_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.garaje_deepal_s05_tire_rear_left_pressure
            name: Tras. izq.
            icon: mdi:tire
            tap_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.garaje_deepal_s05_tire_rear_right_pressure
            name: Tras. der.
            icon: mdi:tire
            tap_action:
              action: more-info
            grid_options:
              columns: 6
      # Alerts: a templated line with everything worth acting on, or a clear
      # all-is-well message. Replace the entity ids like the rest.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Avisos
            icon: mdi:alert-circle-outline
          - type: markdown
            content: >-
              {% set ns = namespace(items=[]) %}
              {% if is_state('binary_sensor.garaje_deepal_s05_s05_any_door_open', 'on') %}
                {% set ns.items = ns.items + ['- Puertas abiertas'] %}
              {% endif %}
              {% if is_state('cover.garaje_deepal_s05_s05_windows', 'open') %}
                {% set ns.items = ns.items + ['- Ventanillas abiertas'] %}
              {% endif %}
              {% if is_state('binary_sensor.garaje_deepal_s05_s05_trunk', 'on') %}
                {% set ns.items = ns.items + ['- Maletero abierto'] %}
              {% endif %}
              {% if is_state('binary_sensor.garaje_deepal_s05_s05_hood', 'on') %}
                {% set ns.items = ns.items + ['- Capó abierto'] %}
              {% endif %}
              {% if is_state('binary_sensor.garaje_deepal_s05_doors_lock_state', 'on') %}
                {% set ns.items = ns.items + ['- Puertas sin cerrar'] %}
              {% endif %}
              {% for label, alarm in [
                ('Del. izq.', 'binary_sensor.garaje_deepal_s05_tire_front_left_alarm'),
                ('Del. der.', 'binary_sensor.garaje_deepal_s05_tire_front_right_alarm'),
                ('Tras. izq.', 'binary_sensor.garaje_deepal_s05_tire_rear_left_alarm'),
                ('Tras. der.', 'binary_sensor.garaje_deepal_s05_tire_rear_right_alarm')] %}
                {% if is_state(alarm, 'on') %}
                  {% set ns.items = ns.items + ['- Presión baja: ' ~ label] %}
                {% endif %}
              {% endfor %}
              {% if is_state('binary_sensor.garaje_deepal_s05_charger_plugged', 'on')
                    and is_state('binary_sensor.garaje_deepal_s05_s05_charging', 'off') %}
                {% set ns.items = ns.items + ['- Cable conectado, sin cargar'] %}
              {% endif %}
              {% set battery = states('sensor.garaje_deepal_s05_battery_level') | float(100) %}
              {% if battery < 20 %}
                {% set ns.items = ns.items + ['- Batería baja (' ~ battery | round(0) | int ~ ' %)'] %}
              {% endif %}
              {% if is_state('binary_sensor.garaje_deepal_s05_connected', 'off') %}
                {% set ns.items = ns.items + ['- Sin conexión con la nube'] %}
              {% endif %}
              {% if ns.items %}
              {{ ns.items | join('\n') }}
              {% else %}
              Sin avisos: todo en orden.
              {% endif %}
