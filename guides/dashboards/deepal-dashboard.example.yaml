# Deepal Alternative - example dashboard view
#
# Derived from the reference "Deepal S05 v5" view with every V2C charger
# element removed (charger tiles, pause switch, session power/energy sensors,
# the charge-target slider and the charge-to-target script).
#
# Prerequisites:
#   * The Deepal Alternative integration, which serves the car images used
#     below under /deepal/frontend/assets/s05/.
#   * The mushroom cards (HACS, piitaya/lovelace-mushroom) for the
#     navigation, tire and steering-wheel cards.
#   * The helpers in deepal-dashboard.helpers.yaml (navigation and seats).
#
# The entity ids below depend on your vehicle name, area and installation
# language: replace them with yours (Settings > Devices & services or
# Developer tools > States). The layout is a single view with four states
# driven by input_select.deepal_vista.
#
# Removed V2C parts are optional: add your charger entities back (or use the
# bundled card) if you want charging-session controls in this view.

views:
  - title: Deepal S05
    path: deepal-s05
    icon: mdi:car
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: sensor.garaje_deepal_s05_battery_level
        name: Bateria
        color: green
      - type: entity
        entity: sensor.garaje_deepal_s05_remaining_range
        name: Autonomia
        color: teal
      - type: entity
        entity: binary_sensor.garaje_deepal_s05_doors_lock_state
        name: Puertas
        color: red
      - type: entity
        entity: binary_sensor.garaje_deepal_s05_charger_plugged
        name: Cargador
        color: amber
    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.deepal_vista
                state_not: Clima
              - condition: state
                entity: input_select.deepal_vista
                state_not: Estado
              - condition: state
                entity: input_select.deepal_vista
                state_not: Carga
            card:
              type: vertical-stack
              cards:
                - type: picture-elements
                  image_entity: image.garaje_deepal_s05_imagen_del_vehiculo
                  elements:
                    - type: state-label
                      entity: sensor.garaje_deepal_s05_total_mileage
                      tap_action:
                        action: more-info
                      style:
                        top: 12%
                        left: 3%
                        transform: translate(0, -50%)
                        font-size: 18px
                        font-weight: 600
                    - type: state-label
                      entity: sensor.garaje_deepal_s05_battery_level
                      tap_action:
                        action: more-info
                      style:
                        top: 12%
                        right: 3%
                        transform: translate(0, -50%)
                        font-size: 30px
                        font-weight: 700
                        color: var(--warning-color)
                    - type: state-label
                      entity: sensor.garaje_deepal_s05_remaining_range
                      suffix: ' de autonomia'
                      tap_action:
                        action: more-info
                      style:
                        top: 84%
                        right: 3%
                        transform: translate(0, -50%)
                        font-size: 16px
                - type: custom:mushroom-template-card
                  primary: Clima interior
                  secondary: Volante y asientos
                  icon: mdi:steering
                  icon_color: blue
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.deepal_vista
                    data:
                      option: Clima
                - type: custom:mushroom-template-card
                  primary: Estado del coche
                  secondary: Puertas, ventanas, luces y neumaticos
                  icon: mdi:car-info
                  icon_color: indigo
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.deepal_vista
                    data:
                      option: Estado
                - type: custom:mushroom-template-card
                  primary: Bateria y carga
                  secondary: Cable, carga y autonomia
                  icon: mdi:battery-charging
                  icon_color: green
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.deepal_vista
                    data:
                      option: Carga
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.deepal_vista
                state: Estado
            card:
              type: vertical-stack
              cards:
                - type: picture-elements
                  image: /deepal/frontend/assets/s05/estado_planta/Ocar1.png
                  elements:
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_hood
                      state_image:
                        'on': /deepal/frontend/assets/s05/estado_planta/Ohood1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/Ohood0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/Ohood0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/Ohood0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_trunk
                      state_image:
                        'on': /deepal/frontend/assets/s05/estado_planta/Otrunk1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/Otrunk0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/Otrunk0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/Otrunk0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_front_left_door
                      state_image:
                        'on': /deepal/frontend/assets/s05/estado_planta/OLF1.png
                        'off': /deepal/frontend/assets/s05/estado_planta/OLF0.png
                        unknown: /deepal/frontend/assets/s05/estado_planta/OLF0.png
                        unavailable: /deepal/frontend/assets/s05/estado_planta/OLF0.png
                      hold_action:
                        action: none
                      tap_action:
                        action: none
                      style:
                        top: 50%
                        left: 50%
                        width: 100%
                        transform: translate(-50%, -50%)
                    - type: image
                      entity: binary_sensor.garaje_deepal_s05_s05_front_right_door
