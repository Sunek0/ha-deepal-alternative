                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_front_right_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_front_right_door
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OopenDoor-windowsRF1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_rear_left_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_rear_left_door
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OopenDoor-windowsLB1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_rear_right_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_rear_right_door
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OopenDoor-windowsRB1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_low_beam
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OlowBeam1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_high_beam
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OlowBeam1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_position_lamp
                          state: 'on'
                      elements:
                        - type: image
                          image: /deepal/frontend/assets/s05/estado_planta/OlowBeam1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: custom:mushroom-template-card
                      entity: sensor.garaje_deepal_s05_tire_front_left_pressure
                      primary: '{{ states(entity) }} bar'
                      secondary: Del. izq.
                      icon: mdi:tire
                      icon_color: >-
                        {{ 'red' if
                        is_state('binary_sensor.garaje_deepal_s05_tire_front_left_alarm',
                        'on') else 'green' }}
                      tap_action:
                        action: more-info
                      style:
                        top: 28%
                        left: 23%
                        transform: translate(-50%, -50%)
                        width: 140px
                    - type: custom:mushroom-template-card
                      entity: sensor.garaje_deepal_s05_tire_front_right_pressure
                      primary: '{{ states(entity) }} bar'
                      secondary: Del. der.
                      icon: mdi:tire
                      icon_color: >-
                        {{ 'red' if
                        is_state('binary_sensor.garaje_deepal_s05_tire_front_right_alarm',
                        'on') else 'green' }}
                      tap_action:
                        action: more-info
                      style:
                        top: 28%
                        left: 77%
                        transform: translate(-50%, -50%)
                        width: 140px
                    - type: custom:mushroom-template-card
                      entity: sensor.garaje_deepal_s05_tire_rear_left_pressure
                      primary: '{{ states(entity) }} bar'
                      secondary: Tras. izq.
                      icon: mdi:tire
                      icon_color: >-
                        {{ 'red' if
                        is_state('binary_sensor.garaje_deepal_s05_tire_rear_left_alarm',
                        'on') else 'green' }}
                      tap_action:
                        action: more-info
                      style:
                        top: 78%
                        left: 23%
                        transform: translate(-50%, -50%)
                        width: 140px
                    - type: custom:mushroom-template-card
                      entity: sensor.garaje_deepal_s05_tire_rear_right_pressure
                      primary: '{{ states(entity) }} bar'
                      secondary: Tras. der.
                      icon: mdi:tire
                      icon_color: >-
                        {{ 'red' if
                        is_state('binary_sensor.garaje_deepal_s05_tire_rear_right_alarm',
                        'on') else 'green' }}
                      tap_action:
                        action: more-info
                      style:
                        top: 78%
                        left: 77%
                        transform: translate(-50%, -50%)
                        width: 140px
                    - type: state-icon
                      entity: lock.garaje_deepal_s05_s05_doors
                      tap_action:
                        action: toggle
                      style:
                        top: 58%
                        left: 49.5%
                        transform: translate(-50%, -50%)
                        --mdc-icon-size: 50px
                    - type: icon
                      icon: mdi:arrow-left
                      tap_action:
                        action: perform-action
                        perform_action: input_select.select_option
                        target:
                          entity_id: input_select.deepal_vista
                        data:
                          option: Exterior
                      style:
                        top: 6%
                        left: 6%
                        transform: translate(-50%, -50%)
                        color: white
                        background: rgba(0, 0, 0, 0.45)
                        border-radius: 50%
                        padding: 10px
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: tile
                      entity: lock.garaje_deepal_s05_s05_doors
                      name: Puertas
                      icon: mdi:car-door-lock
                      color: red
                      features:
                        - type: lock-commands
                    - type: tile
                      entity: cover.garaje_deepal_s05_s05_windows
                      name: Ventanillas
                      icon: mdi:window-closed-variant
                      color: cyan
                    - type: tile
                      entity: binary_sensor.garaje_deepal_s05_charger_plugged
                      name: Cable de carga
                      icon: mdi:ev-plug-type2
                      color: amber
                    - type: tile
                      entity: binary_sensor.garaje_deepal_s05_s05_charging
                      name: Cargando
                      icon: mdi:battery-charging
                      color: green
                    - type: tile
                      entity: binary_sensor.garaje_deepal_s05_s05_engine
                      name: Motor
                      icon: mdi:engine
                      color: orange
                    - type: tile
                      entity: sensor.garaje_deepal_s05_battery_level
                      name: Bateria
                      icon: mdi:car-battery
                      color: green
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.deepal_vista
                state: Clima
            card:
              type: vertical-stack
              cards:
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Climatizacion
                      secondary: Aire y temperatura
                      icon: mdi:air-conditioner
                      icon_color: >-
                        {{ 'blue' if not
                        is_state('input_select.deepal_clima_vista', 'Asientos')
                        else 'grey' }}
                      tap_action:
                        action: perform-action
                        perform_action: input_select.select_option
                        target:
                          entity_id: input_select.deepal_clima_vista
                        data:
                          option: Climatizacion
                    - type: custom:mushroom-template-card
                      primary: Asientos
                      secondary: Calefaccion y ventilacion
                      icon: mdi:car-seat
                      icon_color: >-
                        {{ 'deep-orange' if
                        is_state('input_select.deepal_clima_vista', 'Asientos')
                        else 'grey' }}
                      tap_action:
                        action: perform-action
                        perform_action: input_select.select_option
                        target:
                          entity_id: input_select.deepal_clima_vista
                        data:
                          option: Asientos
                - type: conditional
                  conditions:
                    - condition: state
                      entity: input_select.deepal_clima_vista
                      state_not: Asientos
                  card:
                    type: vertical-stack
                    cards:
                      - type: picture-elements
