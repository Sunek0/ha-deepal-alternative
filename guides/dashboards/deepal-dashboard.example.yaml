                          image: /deepal/frontend/assets/s05/estado_planta/OwindowsLB1.png
                          hold_action:
                            action: none
                          tap_action:
                            action: none
                          style:
                            top: 50%
                            left: 50%
                            width: 100%
                            transform: translate(-50%, -50%)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_window_rear_right_open
                          state: 'on'
                        - condition: state
                          entity: binary_sensor.garaje_deepal_s05_s05_rear_right_door
