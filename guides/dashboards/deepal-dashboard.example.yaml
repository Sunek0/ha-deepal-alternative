                              top: 6%
                              left: 6%
                              transform: translate(-50%, -50%)
                              color: white
                              background: rgba(0, 0, 0, 0.45)
                              border-radius: 50%
                              padding: 10px
                      - type: tile
                        entity: climate.garaje_deepal_s05_cabin_climate
                        name: Habitaculo
                        icon: mdi:air-conditioner
                        features:
                          - type: climate-hvac-modes
                            hvac_modes:
                              - heat_cool
                              - 'off'
                          - type: target-temperature
                - type: conditional
                  conditions:
                    - condition: state
                      entity: input_select.deepal_clima_vista
                      state: Asientos
                  card:
                    type: vertical-stack
                    cards:
                      - type: picture-elements
                        image: /deepal/frontend/assets/s05/asientos/carSeat1.png
                        aspect_ratio: '1:1'
                        elements:
                          - type: icon
                            entity: number.garaje_deepal_s05_s05_front_left_seat_heating_level
                            icon: mdi:car-seat-heater
                            tap_action:
                              action: more-info
                            style:
                              top: 38%
                              left: 32%
                              transform: translate(-50%, -50%)
                              color: '#ff9800'
                              background: rgba(0, 0, 0, 0.35)
                              border-radius: 50%
                              padding: 8px
                          - type: state-label
                            entity: number.garaje_deepal_s05_s05_front_left_seat_heating_level
                            tap_action:
                              action: more-info
                            style:
                              top: 38%
                              left: 39%
                              transform: translate(-50%, -50%)
                              font-size: 16px
                              font-weight: 700
                              color: white
                              text-shadow: 0 0 4px black
                          - type: icon
                            entity: number.garaje_deepal_s05_s05_front_left_seat_ventilation_level
                            icon: mdi:car-seat-cooler
                            tap_action:
                              action: more-info
                            style:
                              top: 49%
                              left: 32%
                              transform: translate(-50%, -50%)
                              color: '#00bcd4'
                              background: rgba(0, 0, 0, 0.35)
                              border-radius: 50%
                              padding: 8px
                          - type: state-label
                            entity: number.garaje_deepal_s05_s05_front_left_seat_ventilation_level
                            tap_action:
                              action: more-info
                            style:
                              top: 49%
                              left: 39%
                              transform: translate(-50%, -50%)
                              font-size: 16px
                              font-weight: 700
                              color: white
                              text-shadow: 0 0 4px black
                          - type: icon
                            entity: number.garaje_deepal_s05_s05_front_right_seat_heating_level
                            icon: mdi:car-seat-heater
                            tap_action:
                              action: more-info
                            style:
                              top: 38%
                              left: 62%
                              transform: translate(-50%, -50%)
                              color: '#ff9800'
                              background: rgba(0, 0, 0, 0.35)
                              border-radius: 50%
                              padding: 8px
                          - type: state-label
                            entity: number.garaje_deepal_s05_s05_front_right_seat_heating_level
                            tap_action:
                              action: more-info
