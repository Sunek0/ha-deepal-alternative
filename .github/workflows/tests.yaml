name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the SDK with its test and Home Assistant dependencies
        run: pip install -e "deepal_sdk[dev,ha]"

      - name: Compile every Python file
        run: python -m compileall -q custom_components/deepal deepal_sdk

      - name: Validate every JSON file
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          for path in Path("custom_components/deepal").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("JSON OK")
          EOF

      - name: Run the test suite
        run: |
          set -o pipefail
          if pytest deepal_sdk/tests -q 2>&1 | tee pytest.log; then
            exit 0
          fi
          # Surface the failure in the check annotations: the job log needs
          # admin rights, the annotation does not.
          tail -n 10 pytest.log | sed 's/^/::error::/'
          exit 1
