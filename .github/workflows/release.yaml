name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the tag matches the manifest version
        run: |
          python - <<'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          components = sorted(
              path for path in Path("custom_components").iterdir() if path.is_dir()
          )
          if len(components) != 1:
              sys.exit(
                  "expected exactly one integration under custom_components/, "
                  f"found {len(components)}"
              )
          component = components[0]
          version = json.loads(
              (component / "manifest.json").read_text(encoding="utf-8")
          )["version"]
          if tag != version:
              sys.exit(
                  f"Tag {tag} does not match manifest version {version} "
                  f"of {component}"
              )
          print(f"Tag {tag} matches manifest version of {component}")
          EOF

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac

          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          : > "$notes_file"
          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ -s "$notes_file" ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --notes-file "$notes_file" $prerelease
            else
              gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" $prerelease
            fi
          else
            if [ -s "$notes_file" ]; then
              gh release create "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --notes-file "$notes_file" \
                --verify-tag $prerelease
            else
              gh release create "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --generate-notes \
                --verify-tag $prerelease
            fi
          fi
